name: Build Ayrvokan Widgets APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_PLATFORM: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_MIN_API: "29"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Fetch build inputs
        run: |
          git lfs install --local
          git lfs pull --include="assets/linux/kali-minimal.tar.gz,assets/dikte/desktop-runtime.tar.gz,assets/vekil/gemma/embeddinggemma-2-text-270m.litertlm" --exclude="dist/*"
          printf '%s  %s\n' '6580e8075b5c6b68459288d9c367851a198770f90fee31e5359cf3c44d4207c5' 'assets/linux/kali-minimal.tar.gz' | sha256sum -c -
          printf '%s  %s\n' '22df8695beb086945b9adb03c668888d5398eed8b24f11f9ad3ae93c38d7bb3a' 'assets/dikte/desktop-runtime.tar.gz' | sha256sum -c -
          printf '%s  %s\n' '2d079ee2f6f066b1f368e8d7c819f55214eaef1d0513b312321901f30ab286fb' 'assets/vekil/gemma/embeddinggemma-2-text-270m.litertlm' | sha256sum -c -

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CONFIGURED_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CONFIGURED_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CONFIGURED_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          keystore="$RUNNER_TEMP/signing/ayrvokan.jks"
          store_password="${CONFIGURED_STORE_PASSWORD:-android}"
          key_password="${CONFIGURED_KEY_PASSWORD:-$store_password}"
          key_alias="${CONFIGURED_KEY_ALIAS:-androiddebugkey}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            keytool -genkeypair -keystore "$keystore" -storepass "$store_password" -keypass "$key_password" -alias "$key_alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ayrvokan Widgets,OU=Ayrvokan,O=Ayrvokan,L=Brussels,C=BE"
          fi
          printf 'APK_KEYSTORE=%s\n' "$keystore" >> "$GITHUB_ENV"
          printf 'APK_KS_PASS=%s\n' "$store_password" >> "$GITHUB_ENV"
          printf 'APK_KEY_PASS=%s\n' "$key_password" >> "$GITHUB_ENV"
          printf 'APK_KEY_ALIAS=%s\n' "$key_alias" >> "$GITHUB_ENV"

      - name: Build APK
        run: python3 tools/build.py

      - name: Record result
        run: |
          sha256sum dist/ayrvokan-widgets-0.12.3.apk
          cat evidence/build-report.json
          printf '### Ayrvokan Widgets APK\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '`%s`\n' "$(sha256sum dist/ayrvokan-widgets-0.12.3.apk)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ayrvokan-widgets-${{ github.run_number }}
          path: |
            dist/ayrvokan-widgets-0.12.3.apk
            dist/ayrvokan-widgets-0.12.3.apk.idsig
            evidence/build-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ayrvokan-widgets-0.12.3.apk dist/ayrvokan-widgets-0.12.3.apk.idsig evidence/build-report.json --verify-tag --generate-notes
